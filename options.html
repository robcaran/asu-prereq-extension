<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ASU Prereq Helper</title>
    <link rel="icon" type="image/png" sizes="128x128" href="icons/icon128.png" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        margin: 12px 16px;
        min-width: 280px;
        color: #222;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin-bottom: 10px;
      }
      button {
        padding: 6px 12px;
        cursor: pointer;
      }
      p.hint {
        margin: 0 0 12px 0;
        color: #444;
        line-height: 1.4;
      }
      #status {
        margin-top: 10px;
        min-height: 1.2em;
        color: #0a6620;
      }
    </style>
  </head>
  <body>
    <p class="hint">
      Optional: set a four-digit ASU session code if prerequisites do not load.
      Find <code>term=</code> in the Class Search URL (for example
      <code>catalog.apps.asu.edu/catalog/classes?term=2257</code>). Leave blank
      to detect the term automatically or use the last session you visited.
    </p>
    <label for="manualStrm">Session code (term)</label>
    <input
      id="manualStrm"
      type="text"
      maxlength="4"
      inputmode="numeric"
      autocomplete="off"
      placeholder="e.g. 2257"
    />
    <button type="button" id="save">Save</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
